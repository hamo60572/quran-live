name: Quran Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      - name: Stream Quran
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}
        run: |
          ffmpeg -re \
          -i "https://server8.mp3quran.net/lhdan/001.mp3" \
          -vn \
          -c:a aac \
          -b:a 128k \
          -f flv "$RTMP_URL"
